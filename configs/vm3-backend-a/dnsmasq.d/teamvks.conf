# /etc/dnsmasq.d/teamvks.conf on vm3-backend-a (Mac 3 role: BACKUP private DNS server, Extension A)
# Where to listen and how to forward other names. Since Phase 2 the teamvks.test
# records are in configs/common/dnsmasq/teamvks-records.conf, shared with the primary
# DNS server on vm1 (configs/vm1-dns/dnsmasq.d/teamvks.conf). Same records, other machine.
# Install:  sudo install -m 644 ~/cn/configs/vm3-backend-a/dnsmasq.d/teamvks.conf /etc/dnsmasq.d/
#           sudo install -m 644 ~/cn/configs/common/dnsmasq/teamvks-records.conf /etc/dnsmasq.d/
# Check:    sudo dnsmasq --test     Apply: sudo systemctl restart dnsmasq

# ---- Where to listen --------------------------------------------------------
# Serve the LAN interface only (dnsmasq adds loopback automatically).
interface=enp0s1
# The address clients send their queries to. Never 127.0.0.1 alone,
# or the other VMs cannot reach this server.
listen-address=192.168.64.13
# Bind exactly these addresses instead of 0.0.0.0:53, so systemd-resolved can
# keep 127.0.0.53:53. "dynamic" also copes with the interface coming up late at boot.
bind-dynamic

# ---- Our private zone -------------------------------------------------------
# The records come from /etc/dnsmasq.d/teamvks-records.conf, byte-for-byte the
# same file as on vm1, so the backup answers exactly like the primary.

# ---- Everything else --------------------------------------------------------
# Don't take upstream servers from /etc/resolv.conf ...
no-resolv
# ... forward other names to the Mac's DNS forwarder (the UTM gateway), so apt still works.
server=192.168.64.1
# Never forward plain names without a dot (e.g. "vm2") to the internet.
domain-needed
# Never forward reverse lookups for private ranges (192.168.x.x) to the internet.
bogus-priv

# ---- Observability ----------------------------------------------------------
# Log every query and answer: sudo journalctl -u dnsmasq -f
log-queries
