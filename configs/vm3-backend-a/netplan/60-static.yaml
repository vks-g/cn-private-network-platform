# /etc/netplan/60-static.yaml on vm3-backend-a (VM3 – Mac 3 role: Backend A)
# Install:  sudo install -m 600 ~/cn/configs/vm3-backend-a/netplan/60-static.yaml /etc/netplan/
# Apply from the UTM console, not over SSH:  sudo netplan try
network:
  version: 2
  renderer: networkd
  ethernets:
    enp0s1:                     # check the name with: ip -br link
      dhcp4: false
      dhcp6: false
      # Ignore the Mac's IPv6 router adverts: they would add the Mac as a second,
      # hidden DNS server (fe80::…). The lab is IPv4-only; link-local fe80:: stays.
      accept-ra: false
      addresses:
        - 192.168.64.13/24      # fixed address; /24 = mask 255.255.255.0
      routes:
        - to: default           # anything outside 192.168.64.0/24 ...
          via: 192.168.64.1     # ... goes to the Mac (UTM gateway + NAT)
      nameservers:
        # Task B: every VM (vm1 included) asks our own DNS server on vm1.
        # dnsmasq answers *.teamvks.test and forwards other names to 192.168.64.1.
        # (Task A used 192.168.64.1 directly, before dnsmasq existed.)
        # Phase 2, Extension A: primary vm1 first, backup vm3 second. If vm1 stops
        # answering, systemd-resolved switches to vm3 ("Current DNS Server" in
        # resolvectl status) and keeps using it until that one fails.
        # DNS-only change, so "sudo netplan apply" over SSH is safe (the IP stays).
        addresses: [192.168.64.11, 192.168.64.13]
