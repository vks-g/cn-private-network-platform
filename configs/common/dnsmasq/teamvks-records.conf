# /etc/dnsmasq.d/teamvks-records.conf on vm1-dns (primary) AND vm3-backend-a (backup)
# Phase 2: the project's DNS records live in this ONE file, installed unchanged on
# both DNS servers, so primary and backup always give the same answers.
# (Real DNS keeps a secondary in sync with a zone transfer, AXFR/IXFR; we copy the file.)
#
# Install:  sudo install -m 644 ~/cn/configs/common/dnsmasq/teamvks-records.conf /etc/dnsmasq.d/
# Check:    sudo dnsmasq --test     Apply: sudo systemctl restart dnsmasq
# Verify:   dig @192.168.64.11 app.teamvks.test   and   dig @192.168.64.13 app.teamvks.test

# Never forward *.teamvks.test upstream: if we don't know a name, it doesn't exist.
local=/teamvks.test/

# Extension B: host-record=<name>,<IPv4>,<TTL>. The last field is the TTL in seconds.
# Phase 1 used address=/name/IP, which dnsmasq answers with TTL 0 ("don't cache").
# TTL 30 lets clients cache the answer for 30 s: shorter = faster cutover after a
# change, longer = fewer queries. Both names point at the edge, never at a backend.
host-record=app.teamvks.test,192.168.64.12,30
host-record=api.teamvks.test,192.168.64.12,30
