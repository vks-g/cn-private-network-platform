# /etc/dnsmasq.d/teamvks.conf on vm1-dns (VM1 – Mac 1 role: private DNS server)
# Answers *.teamvks.test itself and forwards every other name upstream.
# Install:  sudo install -m 644 ~/cn/configs/vm1-dns/dnsmasq.d/teamvks.conf /etc/dnsmasq.d/
# Check:    sudo dnsmasq --test     Apply: sudo systemctl restart dnsmasq

# ---- Where to listen --------------------------------------------------------
# Serve the LAN interface only (dnsmasq adds loopback automatically).
interface=enp0s1
# The address clients send their queries to. Never 127.0.0.1 alone,
# or the other VMs cannot reach this server.
listen-address=192.168.64.11
# Bind exactly these addresses instead of 0.0.0.0:53, so systemd-resolved can
# keep 127.0.0.53:53. "dynamic" also copes with the interface coming up late at boot.
bind-dynamic

# ---- Our private zone -------------------------------------------------------
# Never forward *.teamvks.test upstream: if we don't know a name, it doesn't exist.
local=/teamvks.test/
# Both names point at the edge (nginx on VM2), never at a backend.
address=/app.teamvks.test/192.168.64.12
address=/api.teamvks.test/192.168.64.12

# ---- Everything else --------------------------------------------------------
# Don't take upstream servers from /etc/resolv.conf ...
no-resolv
# ... forward other names to the Mac's DNS forwarder (the UTM gateway), so apt still works.
server=192.168.64.1
# Never forward plain names without a dot (e.g. "vm2") to the internet.
domain-needed
# Never forward reverse lookups for private ranges (192.168.x.x) to the internet.
bogus-priv

# ---- Observability ----------------------------------------------------------
# Log every query and answer: sudo journalctl -u dnsmasq -f
log-queries
