# /etc/nginx/sites-available/teamvks on vm2-edge (VM2 – Mac 2 role: edge proxy + load balancer)
# Install:  sudo install -m 644 ~/cn/configs/vm2-edge/nginx/teamvks.conf /etc/nginx/sites-available/teamvks
#           sudo ln -sf /etc/nginx/sites-available/teamvks /etc/nginx/sites-enabled/teamvks
# Check:    sudo nginx -t        Apply: sudo systemctl reload nginx
#
# Task D: plain HTTP on port 80. Task E adds HTTPS on 443 and turns port 80 into a redirect.
# This file is included inside the http { } block of /etc/nginx/nginx.conf.

# One access-log line per request: the client's socket, the request, the status,
# and which backend (upstream) nginx picked for it.
log_format teamvks '$remote_addr:$remote_port "$request" $status '
                   'upstream=$upstream_addr upstream_status=$upstream_status '
                   'upstream_time=$upstream_response_time';

# The backend pool. No balancing directive = round-robin: A, B, A, B, ...
upstream teamvks_backends {
    # Shared memory, so all nginx worker processes use ONE round-robin counter
    # and one view of which backend is down (without it each worker keeps its own).
    zone teamvks_backends 64k;

    # Passive health check: 1 failed attempt marks a backend "down" for 10 s,
    # then nginx tries it again with real traffic.
    server 192.168.64.13:3001 max_fails=1 fail_timeout=10s;   # Backend A (vm3)
    server 192.168.64.14:3002 max_fails=1 fail_timeout=10s;   # Backend B (vm4)
}

server {
    listen 80;
    server_name app.teamvks.test api.teamvks.test;

    access_log /var/log/nginx/teamvks-access.log teamvks;

    location / {
        # Every request goes to the pool; the client never learns the backend IPs.
        proxy_pass http://teamvks_backends;
        proxy_http_version 1.1;

        # Tell the backend what the client originally asked for and who the client is.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If a backend refuses, times out or returns 502/503/504, retry the same
        # request on the other one, so the client still gets an answer.
        proxy_connect_timeout     2s;
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
