# /etc/nginx/sites-available/teamvks on vm2-edge (VM2 – Mac 2 role: edge proxy + load balancer)
# Install:  sudo install -m 644 ~/cn/configs/vm2-edge/nginx/teamvks.conf /etc/nginx/sites-available/teamvks
#           sudo ln -sf /etc/nginx/sites-available/teamvks /etc/nginx/sites-enabled/teamvks
# Check:    sudo nginx -t        Apply: sudo systemctl reload nginx
#
# Task D: reverse proxy + round-robin load balancing.
# Task E: HTTPS on 443 with a certificate from our own CA; port 80 only redirects.
# This file is included inside the http { } block of /etc/nginx/nginx.conf.

# One access-log line per request: the client's socket, the request (incl. HTTP
# version), the status, the TLS version/cipher, and which backend nginx picked.
log_format teamvks '$remote_addr:$remote_port "$request" $status '
                   'tls=$ssl_protocol/$ssl_cipher '
                   'upstream=$upstream_addr upstream_status=$upstream_status '
                   'upstream_time=$upstream_response_time';

# The backend pool. No balancing directive = round-robin: A, B, A, B, ...
upstream teamvks_backends {
    # Shared memory, so all nginx worker processes use ONE round-robin counter
    # and one view of which backend is down (without it each worker keeps its own).
    zone teamvks_backends 64k;

    # Passive health check: 1 failed attempt marks a backend "down" for 10 s,
    # then nginx tries it again with real traffic.
    server 192.168.64.13:3001 max_fails=1 fail_timeout=10s;   # Backend A (vm3)
    server 192.168.64.14:3002 max_fails=1 fail_timeout=10s;   # Backend B (vm4)
}

# Port 80: never serve content in clear text, send the client to HTTPS instead.
server {
    listen 80;
    server_name app.teamvks.test api.teamvks.test;

    access_log /var/log/nginx/teamvks-access.log teamvks;

    # 301 = moved permanently; same host and path, but https://
    return 301 https://$host$request_uri;
}

# Port 443: TLS terminates here. Client <-> edge is encrypted;
# edge -> backend is a separate plain-HTTP connection on the private LAN.
server {
    # nginx 1.24 (Ubuntu 24.04) enables HTTP/2 on the listen line;
    # newer nginx versions use a separate "http2 on;" directive instead.
    listen 443 ssl http2;
    server_name app.teamvks.test api.teamvks.test;

    # Certificate signed by our CA (public) and its private key (stays on vm2 only).
    ssl_certificate     /etc/nginx/tls/teamvks-server.crt;
    ssl_certificate_key /etc/nginx/tls/teamvks-server.key;
    # Only modern TLS versions; SSLv3, TLS 1.0 and 1.1 are refused.
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/teamvks-access.log teamvks;

    location / {
        # Every request goes to the pool; the client never learns the backend IPs.
        proxy_pass http://teamvks_backends;
        proxy_http_version 1.1;

        # Tell the backend what the client originally asked for and who the client is.
        # X-Forwarded-Proto is now "https": the backend learns the client used TLS.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If a backend refuses, times out or returns 502/503/504, retry the same
        # request on the other one, so the client still gets an answer.
        proxy_connect_timeout     2s;
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
